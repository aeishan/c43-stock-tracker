<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends</title>
    <link rel="stylesheet" href="./css/main.css" />
</head>
<style>
    .friend-card {
        background-color: #1e1e1e;
        border: 1px solid #555;
        border-radius: 8px;
        padding: 12px;
        margin: 10px 0;
        color: #fff;
        list-style: none;
        transition: background-color 0.2s;
    }

    .friend-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem;
    }

    .modified-time {
        font-size: 0.9em;
        color: #bbb;
        margin-top: 4px;
    }

    .section {
        margin-bottom: 2rem;
    }
</style>

<body>
    <div class="page-container">
        <h1>Friends & Requests</h1>

        <div class="section">
            <h2>Friends</h2>
            <ul id="friendsList" class="list-container"></ul>
        </div>

        <div class="section">
            <h2>Incoming Requests</h2>
            <ul id="incomingList" class="list-container"></ul>
        </div>

        <div class="section">
            <h2>Outgoing Requests</h2>
            <ul id="outgoingList" class="list-container"></ul>
        </div>

        <div class="section">
            <h2>Send Friend Request</h2>
            <div class="friend-request-form">
                <input type="number" id="friendIdInput" placeholder="Enter Account ID..." />
                <button onclick="sendFriendRequest()">Send</button>
            </div>
        </div>
    </div>

    <script src="./js/friends.js"></script>
</body>

</html>
