<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leave Review</title>
  <link rel="stylesheet" href="./css/main.css" />
  <style>
    .form-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    input[type="number"],
    textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      resize: vertical;
    }

    .message {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div>
    <button
      onclick="window.location.href='/reviews.html'"
      style="margin-bottom: 1rem"
    >
      Check Reviews for a Stock List
    </button>
  </div>
  <div class="container">
    <h1>Create a Review</h1>
    <div class="form-container">
      <div class="form-group">
        <label for="stockListId">Stock List ID</label>
        <input type="number" id="stockListId" required />
      </div>
      <div class="form-group">
        <label for="review">Your Review</label>
        <textarea id="review" rows="5" required></textarea>
      </div>
      <button id="submitReview">Submit Review</button>
      <div id="message" class="message"></div>
    </div>
  </div>

  <script src="./js/leaveReview.js"></script>
</body>
</html>
