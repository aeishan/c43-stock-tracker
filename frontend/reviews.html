<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Reviews</title>
    <link rel="stylesheet" href="./css/main.css" />
    <style>
        .review-card {
            border: 1px solid #ccc;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
        }
    </style>
</head>

<body>

        <div id="reviewsContainer"></div>
    </div>

    <script src="./js/reviews.js"></script>

</html>
