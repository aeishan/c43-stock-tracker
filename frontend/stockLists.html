<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Stock Lists</title>
    <link rel="stylesheet" href="./css/main.css" />
    <style>
        .stock-list-card {
            border: 1px solid #ccc;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            max-width: 250px;
            margin-bottom: 2rem;
        }

        .card-btn-cont {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div style="display: flex; gap: 2rem;">
        <div style="flex: 2;">
            <div class="action-buttons">
                <button onclick="window.location.href='/addStockList.html'">
                    Add New Stock List
                </button>

                <button onclick="window.location.href='/leaveReview.html'">
                    Leave Review on a Stock List
                </button>

                <button onclick="window.location.href='/reviews.html'">
                    Check Reviews for a Stock List
                </button>
            </div>

            <div class="container">
                <h1>All Stock Lists You Can View</h1>
                <div id="stockListsContainer">Loading...</div>
            </div>
        </div>

        <div style="flex: 1;">
            <div class="stock-list-card">
                <h2>Share a Stock List</h2>
                <form id="shareForm">
                    <label for="viewerId">Friend Account ID:</label><br />
                    <input type="number" id="viewerId" required /><br /><br />

                    <label for="stockListId">Stock List ID:</label><br />
                    <input type="number" id="stockListId" required /><br /><br />

                    <button type="submit">Share to Friend</button>
                </form>
            </div>
        </div>
    </div>

    <script src="./js/stockLists.js"></script>
</body>
</html>
