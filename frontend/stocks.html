<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stocks</title>
  <link rel="stylesheet" href="/css/main.css" />

  <style>
    body {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 20px;
    }

    #stockList .stock-item {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }

    #addStockPanel {
      padding: 12px;
      border: 1px solid #444;
      margin-top: 8px;
      background: #222;
      border-radius: 6px;
    }

    #addStockPanel label {
      display: block;
      margin-top: 6px;
    }

    #addStockPanel input {
      width: 100%;
      margin-top: 4px;
      padding: 6px;
    }

    .chart-container {
      width: 60%;
      height: 350px;
      margin-top: 20px;
    }

    .chart-container.hidden {
      visibility: hidden;
      width: 0;
      height: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <h1>Stocks</h1>

  <!-- SEARCH BAR -->
  <section>
    <input id="searchInput" type="text" placeholder="Enter symbol (AAPL)" />
    <button id="searchBtn">Search</button>
  </section>

  <!-- SEARCH RESULT -->
  <div id="searchResult" style="margin-top: 20px;"></div>

  <!-- CHART AREA -->
  <div id="chartContainer" class="chart-container">
    <canvas id="rangeChart"></canvas>
  </div>  

  <hr />

  <!-- STOCK LIST -->
  <section>
    <h2>All Stocks</h2>
    <div id="stockList"></div>
  </section>

  <hr />

  <!-- ADD STOCK PANEL (TOGGLED) -->
  <button id="toggleAddStock">Add Stock Data ▼</button>

  <div id="addStockPanel">
    <h3>Add Daily Stock Data</h3>

    <label>Symbol</label>
    <input type="text" id="addSymbol" placeholder="AAPL" />

    <label>Date</label>
    <input type="date" id="addTimestamp" />

    <label>Open</label>
    <input type="number" id="addOpen" step="0.01" />

    <label>High</label>
    <input type="number" id="addHigh" step="0.01" />

    <label>Low</label>
    <input type="number" id="addLow" step="0.01" />

    <label>Close (required)</label>
    <input type="number" id="addClose" step="0.01" />

    <label>Volume</label>
    <input type="number" id="addVolume" />

    <button id="submitAddStock" style="margin-top:12px;">Submit</button>

    <p id="addStockMsg" style="margin-top:8px;"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/stocks.js"></script>
</body>

</html>
